<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Langues · Points actu</title>
<meta name="description" content="15 minutes d'anglais le matin, 15 minutes d'ukrainien le soir">
<meta name="theme-color" content="#F3F1EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0C0E" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@1,6..72,500&display=swap">
<style>
/* Mêmes jetons que index.html ; chaque langue a sa couleur (--c). */
:root{
  --bg:#F3F1EC; --surface:#FFFFFF; --surface-2:#EAE7E0; --ink:#0F1012; --ink-2:#3B3E44; --muted:#767980; --line:#E2DED6;
  --accent:#FF4D2E; --ok:#2E7D4F; --ko:#D93A2B; --warn:#E08A00;
  --c-en:#2F5BEA; --c-uk:#0A6ED1; --c-uk2:#F2B705;
  --display:"Bricolage Grotesque","Inter",system-ui,sans-serif;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Newsreader",Georgia,serif;
  --r:24px; --shadow:0 1px 2px rgba(15,16,18,.04),0 8px 24px -12px rgba(15,16,18,.18);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0B0C0E; --surface:#16181B; --surface-2:#1F2226; --ink:#F2F0EB; --ink-2:#C8C6C0; --muted:#8B8E95; --line:#25282D;
  --accent:#FF6A4D; --ok:#3FA36B; --ko:#F0574A; --warn:#F2A31B;
  --c-en:#5B82FF; --c-uk:#3D95F0; --c-uk2:#FFC933;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.7);
  color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
body[data-c=en]{--c:var(--c-en)} body[data-c=uk]{--c:var(--c-uk)}
a{color:inherit}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2.5px solid var(--c);outline-offset:3px;border-radius:8px}

.top{position:sticky;top:0;z-index:10;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;
  background:color-mix(in srgb,var(--bg) 85%,transparent);-webkit-backdrop-filter:saturate(1.8) blur(16px);backdrop-filter:saturate(1.8) blur(16px)}
.top-in{max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.icon-btn{width:40px;height:40px;flex:none;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;text-decoration:none;transition:transform .15s}
.icon-btn:active{transform:scale(.9)}
.icon-btn svg{width:18px;height:18px}
.seg{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--surface-2)}
.seg button{padding:8px 13px;border-radius:999px;font:700 .85rem/1 var(--display);white-space:nowrap;transition:background .2s}
.seg button.on{background:var(--surface);box-shadow:var(--shadow)}
.bar{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--c);transition:width .35s ease}

.wrap{max-width:720px;margin:0 auto;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 56px)}
.banner{margin:8px 0 0;padding:10px 14px;border-radius:14px;background:color-mix(in srgb,var(--warn) 16%,var(--surface));font-size:.85rem;font-weight:600}

/* Accueil */
.hero{padding:22px 0 6px}
.kicker{margin:0;font:700 .74rem/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hero h1{font:800 clamp(2.6rem,12vw,4rem)/.95 var(--display);letter-spacing:-.05em;margin:10px 0 0}
.hero h1 span{color:var(--c)}
body[data-c=uk] .hero h1 span{background:linear-gradient(180deg,var(--c-uk) 50%,var(--c-uk2) 50%);-webkit-background-clip:text;background-clip:text;color:transparent}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}
.stat{background:var(--surface);border-radius:20px;padding:14px;box-shadow:var(--shadow)}
.stat b{display:block;font:800 1.8rem/1 var(--display);letter-spacing:-.04em}
.stat span{display:block;margin-top:4px;font-size:.75rem;line-height:1.25;color:var(--muted);font-weight:600}
.plan{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:8px}
.plan li{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:18px;padding:13px 15px;box-shadow:var(--shadow)}
.plan .ck{width:26px;height:26px;flex:none;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.8rem;font-weight:800}
.plan li.done .ck{background:var(--ok);border-color:var(--ok);color:#fff}
.plan li.done .t{color:var(--muted);text-decoration:line-through}
.plan .t{flex:1;font-weight:600}
.plan .m{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.cta{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:18px;padding:17px;border-radius:999px;background:var(--c);color:#fff;font:800 1.1rem/1 var(--display);letter-spacing:-.01em;box-shadow:0 14px 30px -14px var(--c);transition:transform .15s}
.cta:active{transform:scale(.97)}
.cta.ghost{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-size:.95rem;padding:14px}
.cta[disabled]{opacity:.4}
.row{display:flex;gap:10px}
.row>*{flex:1}
.note{margin:14px 0 0;font-size:.85rem;color:var(--muted);text-align:center}
.path{margin-top:30px}
.path h2,.sec-h{font:800 1.4rem/1 var(--display);letter-spacing:-.03em;margin:0 0 12px}
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.lessons button{aspect-ratio:1;border-radius:12px;background:var(--surface-2);font:700 .8rem/1 var(--display);color:var(--muted)}
.lessons button.done{background:color-mix(in srgb,var(--c) 22%,var(--surface));color:var(--ink)}
.lessons button.next{background:var(--c);color:#fff}

/* Séance */
.step-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 0 4px}
.step-h .kicker{color:var(--c)}
.step-h .cnt{font:700 .8rem/1 var(--sans);color:var(--muted);font-variant-numeric:tabular-nums}
.panel{background:var(--surface);border-radius:28px;padding:22px 20px;box-shadow:var(--shadow);margin-top:12px;animation:rise .35s ease both}
.panel h2{font:800 1.7rem/1.05 var(--display);letter-spacing:-.035em;margin:0 0 10px;text-wrap:balance}
.panel p{margin:0 0 10px;color:var(--ink-2);text-wrap:pretty}
.panel p.q{color:var(--ink)}
.rules{margin:14px 0 0;padding:0;list-style:none;display:grid;gap:10px}
.rules li{padding-left:16px;position:relative;color:var(--ink-2);line-height:1.5}
.rules li::before{content:"";position:absolute;left:0;top:.62em;width:7px;height:7px;border-radius:50%;background:var(--c)}
.ex{display:flex;align-items:flex-start;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.ex:first-child{border-top:0}
.ex .txt{flex:1;min-width:0}
.ex .tg{font-weight:600;overflow-wrap:anywhere}
.ex .tr{font-size:.82rem;color:var(--c);font-style:italic}
.ex .fr{font-size:.88rem;color:var(--muted)}
.say{flex:none;width:34px;height:34px;border-radius:50%;background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--c);display:grid;place-items:center}
.say svg{width:16px;height:16px}
.trap{margin-top:16px;padding:14px 16px;border-radius:18px;background:color-mix(in srgb,var(--warn) 13%,var(--surface));font-size:.94rem;line-height:1.5}
.trap b{display:block;font:700 .7rem/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--warn);margin-bottom:6px}

/* Carte de révision */
.flash{min-height:300px;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:10px}
.flash .dir{font:700 .7rem/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.flash .q{font:800 clamp(1.7rem,8vw,2.4rem)/1.1 var(--display);letter-spacing:-.03em;overflow-wrap:anywhere;text-wrap:balance}
.flash .a{font:700 1.4rem/1.2 var(--display);color:var(--c);overflow-wrap:anywhere}
.flash .tr{font-style:italic;color:var(--muted)}
.flash .exs{margin-top:8px;padding-top:12px;border-top:1px solid var(--line);font-size:.92rem;color:var(--ink-2)}
.flash .exs i{display:block;color:var(--muted);font-style:normal;font-size:.85rem}
.flash .say{margin:4px auto 0;width:44px;height:44px}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px}
.grades button{padding:13px 4px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow);font-weight:700;font-size:.85rem;display:flex;flex-direction:column;align-items:center;gap:3px}
.grades button small{font-weight:500;color:var(--muted);font-size:.7rem}
.grades .g0{color:var(--ko)} .grades .g3{color:var(--ok)}

/* Exercices */
.q{font:700 1.3rem/1.3 var(--display);letter-spacing:-.02em;margin:0 0 6px;overflow-wrap:anywhere}
.hint{font-size:.85rem;color:var(--muted);margin:0 0 12px}
.choices{display:grid;gap:8px;margin-top:14px}
.choice{text-align:left;padding:14px 16px;border-radius:16px;border:2px solid var(--line);font-weight:600;transition:border-color .2s,background .2s;overflow-wrap:anywhere}
.choice.good{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.choice.bad{border-color:var(--ko);background:color-mix(in srgb,var(--ko) 10%,var(--surface))}
.field{width:100%;margin-top:12px;padding:14px 16px;border-radius:16px;border:2px solid var(--line);background:var(--bg);font-size:1.05rem}
.field:focus{outline:none;border-color:var(--c)}
.fb{margin-top:14px;padding:13px 15px;border-radius:16px;font-size:.93rem;line-height:1.5}
.fb.good{background:color-mix(in srgb,var(--ok) 13%,var(--surface))}
.fb.bad{background:color-mix(in srgb,var(--ko) 11%,var(--surface))}
.fb b{display:block;margin-bottom:3px}
.model{margin-top:12px;padding:14px 16px;border-radius:16px;background:color-mix(in srgb,var(--c) 10%,var(--surface))}
.model .tg{font-weight:700;font-size:1.05rem}

/* Lecture */
.read{font:500 1.06rem/1.7 var(--sans);color:var(--ink)}
.read p{color:var(--ink)}
.vocab{display:grid;gap:6px;margin-top:10px}
.voc{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--surface-2)}
.voc span{flex:1;font-size:.92rem}
.voc b{font-weight:700}
.add{flex:none;padding:7px 11px;border-radius:999px;background:var(--c);color:#fff;font-size:.75rem;font-weight:700}
.add[disabled]{background:var(--ok);opacity:.8}
details.qa{margin-top:8px;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line)}
details.qa summary{font-weight:600;cursor:pointer}
details.qa p{margin:8px 0 0;color:var(--ink-2)}
.src{display:inline-flex;margin-top:14px;padding:7px 12px;border-radius:999px;background:var(--surface-2);font-size:.78rem;font-weight:600;text-decoration:none}

/* Fin */
.end{text-align:center;padding:40px 0 10px}
.end .big{font:800 5rem/1 var(--display);letter-spacing:-.06em;color:var(--c)}
.end h2{font:800 1.9rem/1.05 var(--display);letter-spacing:-.04em;margin:10px 0 8px}
.end p{color:var(--muted);margin:0}

/* Réglages */
.set label{display:block;font-weight:700;font-size:.85rem;margin-top:16px}
.set .help{font-size:.85rem;color:var(--muted);line-height:1.5;margin:6px 0 0}
.set ol{padding-left:20px;margin:8px 0 0;font-size:.88rem;color:var(--ink-2);line-height:1.55}
.status{margin-top:12px;font-size:.85rem;font-weight:600}
.status.ok{color:var(--ok)} .status.ko{color:var(--ko)}
.sync{font-size:.72rem;color:var(--muted);font-weight:600;white-space:nowrap}

@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body data-c="en">
<header class="top">
  <div class="top-in">
    <a class="icon-btn" href="./" aria-label="Retour aux points actu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <div class="seg" id="seg">
      <button type="button" data-c="en">☀ Anglais</button>
      <button type="button" data-c="uk">☾ Українська</button>
    </div>
    <button class="icon-btn" id="gear" type="button" aria-label="Réglages">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </div>
  <div class="bar" id="bar"></div>
</header>
<div class="wrap">
  <div class="banner" id="banner" hidden></div>
  <main id="app"><div class="hero"><p class="kicker">Chargement…</p></div></main>
</div>
<script>
(function(){
  var COURSES={
    en:{nom:"Anglais",titre:["Daily ","English"],voix:"en-GB",dir:["En anglais ?","En français ?"],data:"data/learn/en.json",moment:"le matin"},
    uk:{nom:"Ukrainien",titre:["Щодня ","українська"],voix:"uk-UA",dir:["En ukrainien ?","En français ?"],data:"data/learn/uk.json",moment:"le soir"}
  };
  var REPO="mikeriin/points-actu",BRANCH="progression",FILE="progress.json",API="https://api.github.com/repos/"+REPO;
  var REV_MAX=25;
  var SPEAK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>';

  var course=null,lessons={},news=null,P=null,session=null,dirty=false,pushing=false,lastPush=0,sha=null;

  /* ---------- utilitaires ---------- */
  function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=nb(x);return e}
  function nb(x){return String(x).replace(/ ([:;!?»])/g," $1").replace(/« /g,"« ")}
  function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
  function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  function today(){return isoDay(new Date())}
  function isoDay(d){
    var f=new Intl.DateTimeFormat("fr-CA",{timeZone:"Europe/Paris",year:"numeric",month:"2-digit",day:"2-digit"});
    return f.format(d);
  }
  function addDays(s,n){var a=s.split("-").map(Number);var d=new Date(Date.UTC(a[0],a[1]-1,a[2]+n,12));return d.toISOString().slice(0,10)}
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
  function app(){var m=document.getElementById("app");m.textContent="";window.scrollTo(0,0);return m}
  function btn(c,label,fn){var b=el("button",c,label);b.type="button";if(fn)b.addEventListener("click",fn);return b}
  function bar(x){document.getElementById("bar").style.width=(x*100)+"%"}

  /* ---------- voix ---------- */
  var voices=[];
  function loadVoices(){try{voices=speechSynthesis.getVoices()}catch(e){}}
  if("speechSynthesis" in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
  function voiceFor(lang){
    var p=lang.slice(0,2);
    return voices.filter(function(v){return v.lang.replace("_","-")===lang})[0]||voices.filter(function(v){return v.lang.slice(0,2)===p})[0]||null;
  }
  function speak(text,lang){
    if(!("speechSynthesis" in window)||!text)return;
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=lang==="uk-UA"?.85:.95;
    var v=voiceFor(lang);if(v)u.voice=v;
    else if(lang==="uk-UA"&&!lsGet("ukVoiceWarned")){lsSet("ukVoiceWarned","1");banner("Pas de voix ukrainienne sur cet appareil : ajoute-la dans Réglages › Accessibilité › Contenu énoncé › Voix (iPhone) ou Synthèse vocale (Android).")}
    speechSynthesis.speak(u);
  }
  function sayBtn(text){var b=el("button","say");b.type="button";b.setAttribute("aria-label","Écouter");b.innerHTML=SPEAK;b.addEventListener("click",function(e){e.stopPropagation();speak(text,COURSES[course].voix)});return b}
  function banner(t){var b=document.getElementById("banner");b.textContent=t;b.hidden=!t}

  /* ---------- progression ---------- */
  function blank(){return {v:1,updatedAt:0,courses:{en:blankC(),uk:blankC()}}}
  function blankC(){return {next:1,done:{},cards:{},custom:{},days:{}}}
  function loadLocal(){try{var j=JSON.parse(lsGet("learn")||"null");if(j&&j.courses)return norm(j)}catch(e){}return blank()}
  function norm(p){p.courses=p.courses||{};["en","uk"].forEach(function(k){var c=p.courses[k]=p.courses[k]||blankC();["done","cards","custom","days"].forEach(function(f){c[f]=c[f]||{}});c.next=c.next||1});return p}
  function save(){P.updatedAt=Date.now();lsSet("learn",JSON.stringify(P));dirty=true;lsSet("learnDirty","1")}
  function C(){return P.courses[course]}
  function day(){var d=C().days,t=today();return d[t]=d[t]||{rev:0,ok:0}}
  // Fusion : on ne perd jamais rien entre téléphone et GitHub.
  function merge(a,b){
    var out=blank();out.updatedAt=Math.max(a.updatedAt||0,b.updatedAt||0);
    ["en","uk"].forEach(function(k){
      var x=a.courses[k],y=b.courses[k],o=out.courses[k];
      o.next=Math.max(x.next||1,y.next||1);
      o.done=Object.assign({},y.done,x.done);
      o.custom=Object.assign({},y.custom,x.custom);
      o.cards=Object.assign({},y.cards);
      Object.keys(x.cards).forEach(function(id){var p=x.cards[id],q=o.cards[id];if(!q||(p.t||0)>=(q.t||0))o.cards[id]=p});
      o.days={};
      Object.keys(Object.assign({},x.days,y.days)).forEach(function(d){
        var p=x.days[d]||{},q=y.days[d]||{},r={};
        Object.keys(Object.assign({},p,q)).forEach(function(f){var u=p[f],v=q[f];r[f]=typeof u==="number"||typeof v==="number"?Math.max(u||0,v||0):(u||v)});
        o.days[d]=r;
      });
    });
    return out;
  }
  function streak(c){
    var d=P.courses[c].days,n=0,t=today();
    var act=function(s){var x=d[s];return x&&(x.rev>0||x.lec||x.lire)};
    if(!act(t))t=addDays(t,-1);
    while(act(t)){n++;t=addDays(t,-1)}
    return n;
  }
  function cardData(id){
    var L=lessons[course];
    if(C().custom[id])return C().custom[id];
    if(!L)return null;
    var lid=id.split("-")[0];
    var les=L.byId[lid];if(!les)return null;
    for(var i=0;i<les.cartes.length;i++)if(les.cartes[i].id===id)return les.cartes[i];
    return null;
  }
  function dueList(){
    var t=today(),cs=C().cards;
    return Object.keys(cs).filter(function(id){return cs[id].d<=t&&cardData(id)}).sort(function(a,b){return cs[a].d<cs[b].d?-1:cs[a].d>cs[b].d?1:Math.random()-.5});
  }
  function addCard(id){if(!C().cards[id])C().cards[id]={d:addDays(today(),1),i:0,e:250,r:0,l:0,t:Date.now()}}
  // Répétition espacée (SM-2 simplifié). g : 0 à revoir, 1 difficile, 2 bien, 3 facile.
  function grade(id,g){
    var s=C().cards[id],e=s.e/100,i=s.i;
    if(g===0){i=1;e=Math.max(1.3,e-.2);s.l++;s.r=0}
    else{
      if(g===1){i=Math.max(1,Math.round(i*1.2));e=Math.max(1.3,e-.15)}
      else if(g===2){i=s.r===0?1:s.r===1?3:Math.round(i*e)}
      else{i=s.r===0?3:Math.round(Math.max(i,1)*e*1.3);e+=.15}
      s.r++;
    }
    s.i=Math.min(i,365);s.e=Math.round(e*100);s.d=addDays(today(),s.i);s.t=Date.now();
    var d=day();d.rev++;if(g>0)d.ok++;save();
  }
  function nextIv(id,g){
    var s=C().cards[id],e=s.e/100,i=s.i;
    if(g===0)return 1;if(g===1)return Math.max(1,Math.round(i*1.2));
    if(g===2)return s.r===0?1:s.r===1?3:Math.round(i*e);
    return s.r===0?3:Math.round(Math.max(i,1)*e*1.3);
  }
  function ivLabel(n){return n<30?n+" j":n<365?Math.round(n/30)+" mois":"1 an"}

  /* ---------- GitHub ---------- */
  function token(){return lsGet("ghToken")||""}
  function gh(path,opt){
    opt=opt||{};opt.headers=Object.assign({"Accept":"application/vnd.github+json","Authorization":"Bearer "+token(),"X-GitHub-Api-Version":"2022-11-28"},opt.headers||{});
    opt.cache="no-store";
    return fetch(API+path,opt);
  }
  function b64e(s){var b=new TextEncoder().encode(s),o="";for(var i=0;i<b.length;i+=8192)o+=String.fromCharCode.apply(null,b.subarray(i,i+8192));return btoa(o)}
  function b64d(s){var bin=atob(s.replace(/\s/g,"")),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder().decode(u)}
  async function pull(){
    if(!token())return false;
    var r=await gh("/contents/"+FILE+"?ref="+BRANCH);
    if(r.status===404){sha=null;return true}
    if(!r.ok)throw new Error("GitHub "+r.status);
    var j=await r.json();sha=j.sha;
    var remote=norm(JSON.parse(b64d(j.content)));
    P=merge(P,remote);lsSet("learn",JSON.stringify(P));
    return true;
  }
  async function ensureBranch(){
    var r=await gh("/git/ref/heads/"+BRANCH);if(r.ok)return;
    if(r.status!==404)throw new Error("GitHub "+r.status);
    var m=await gh("/git/ref/heads/main");if(!m.ok)throw new Error("GitHub "+m.status);
    var mj=await m.json();
    var c=await gh("/git/refs",{method:"POST",body:JSON.stringify({ref:"refs/heads/"+BRANCH,sha:mj.object.sha})});
    if(!c.ok&&c.status!==422)throw new Error("GitHub "+c.status);
  }
  async function push(force){
    if(!token()||pushing)return;
    if(!force&&(!dirty&&lsGet("learnDirty")!=="1"))return;
    pushing=true;setSync("synchro…");
    try{
      await ensureBranch();
      for(var k=0;k<2;k++){
        await pull();
        var body={message:"Progression langues — "+today(),content:b64e(JSON.stringify(P,null,1)),branch:BRANCH};
        if(sha)body.sha=sha;
        var r=await gh("/contents/"+FILE,{method:"PUT",body:JSON.stringify(body)});
        if(r.ok){var j=await r.json();sha=j.content.sha;dirty=false;lsSet("learnDirty","0");lastPush=Date.now();setSync("sauvegardé ✓");return}
        if(r.status!==409&&r.status!==422)throw new Error("GitHub "+r.status);
      }
      throw new Error("conflit");
    }catch(e){setSync("non synchronisé");console.warn(e)}
    finally{pushing=false}
  }
  function setSync(t){var s=document.getElementById("sync");if(s)s.textContent=t;lsSet("syncMsg",t)}

  }

  function start(bonus){

  async function setCourse(c){
    course=c;document.body.dataset.c=c;lsSet("course",c);
    [].forEach.call(document.querySelectorAll("#seg button"),function(b){b.classList.toggle("on",b.dataset.c===c)});
    await loadCourse(c);home();
  }
  document.getElementById("seg").addEventListener("click",function(e){var b=e.target.closest("button");if(b&&!session)setCourse(b.dataset.c);else if(b&&session&&confirm("Quitter la séance en cours ?")){session=null;setCourse(b.dataset.c)}});
  document.getElementById("gear").addEventListener("click",function(){if(!session||confirm("Quitter la séance en cours ?")){session=null;settings()}});
  document.addEventListener("visibilitychange",function(){if(document.hidden&&Date.now()-lastPush>60e3)push(false)});

  P=loadLocal();
  var q=new URLSearchParams(location.search).get("c");
  // Anglais le matin, ukrainien à partir de 14h, sauf choix explicite.
  var h=+new Intl.DateTimeFormat("fr-FR",{timeZone:"Europe/Paris",hour:"2-digit",hour12:false}).format(new Date())%24;
  var first=COURSES[q]?q:(h<14?"en":"uk");
  setCourse(first);
  // Actu et sauvegarde GitHub arrivent ensuite : on rafraîchit l'accueil si aucune séance n'a commencé.
  Promise.all([loadNews(),pull().catch(function(){setSync("hors ligne")})]).then(function(){if(!session&&course)loadCourse(course).then(function(){if(!session)home()})});
  if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
})();
</script>
</body>
</html>
