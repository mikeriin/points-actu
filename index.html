<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Points actu</title>
<meta name="description" content="Points actualité de 6h, 12h et 18h">
<meta name="theme-color" content="#F6F6F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D0E10" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Points actu">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Même système que learn.html : surfaces plates, une couleur par rubrique, lecture en trois niveaux. */
:root{
  --bg:#F6F6F3; --surface:#FFFFFF; --soft:#EEEEEA; --ink:#101113; --ink-2:#45484E; --muted:#8A8D93; --line:#E6E6E1;
  --c:#FF5A36; --ok:#12A150;
  --c-def:#1F9D55; --c-fra:#3A5BFF; --c-ge:#E5484D; --c-occ:#E59500; --c-jv:#8E4EFF; --c-cul:#E0457B;
  --c-en:#3A5BFF; --c-uk:#0A6CFF; --c-uk2:#FFC400;
  --display:"Bricolage Grotesque","Inter",system-ui,sans-serif;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.3,1.5,.5,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0D0E10; --surface:#17181B; --soft:#202226; --ink:#F3F2EE; --ink-2:#C4C3BE; --muted:#7D8087; --line:#26282C;
  --c:#FF7656; --ok:#2CC56F;
  --c-def:#3DBB74; --c-fra:#6E86FF; --c-ge:#FF6369; --c-occ:#FFB224; --c-jv:#A97BFF; --c-cul:#F2669A;
  --c-en:#6E86FF; --c-uk:#4C95FF; --c-uk2:#FFD02E;
  color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased;min-height:100dvh;overflow-x:hidden}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--c);outline-offset:3px;border-radius:10px}

/* Barre du haut */
.top{position:sticky;top:0;z-index:20;padding:calc(env(safe-area-inset-top,0px) + 8px) 16px 8px;background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6)}
.top-in{max-width:620px;margin:0 auto;height:44px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.wm{display:flex;align-items:center;gap:9px;font:800 1.12rem/1 var(--display);letter-spacing:-.03em}
.live{width:8px;height:8px;border-radius:50%;background:var(--c);animation:live 2s ease-out infinite}
.live.off{background:var(--muted);animation:none}
@keyframes live{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c) 55%,transparent)}70%,100%{box-shadow:0 0 0 7px transparent}}
.top-r{display:flex;align-items:center;gap:6px}
.checked{font-size:.74rem;color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.ib{width:40px;height:40px;flex:none;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);transition:background .2s,transform .15s var(--spring)}
.ib:active{transform:scale(.88);background:var(--soft)}
.ib svg{width:19px;height:19px}
.ib.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.read-bar{position:absolute;left:0;right:0;bottom:0;height:2px}
.read-bar b{display:block;height:100%;width:0;background:var(--c);transition:width .4s var(--ease)}

.wrap{max-width:620px;margin:0 auto;padding:0 20px calc(env(safe-area-inset-bottom,0px) + 48px)}
.screen>*{animation:in .45s var(--ease) both;animation-delay:calc(var(--i,0) * 55ms)}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
.toast{margin:6px 0 0;padding:11px 15px;border-radius:14px;background:var(--ink);color:var(--bg);font-size:.85rem;font-weight:500}
.k{margin:0;font:600 .72rem/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--c)}

/* Tête du point */
.mast{padding:18px 0 0}
.mast .k{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.new{background:var(--c);color:#fff;border-radius:999px;padding:4px 8px;font-size:.62rem;letter-spacing:.1em;animation:pop .5s var(--spring) both}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.big{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-top:10px}
.big h1{font:800 clamp(4.4rem,23vw,6.6rem)/.8 var(--display);letter-spacing:-.065em;margin:0}
.big h1 span{color:var(--c)}
.big .side{text-align:right;padding-bottom:4px}
.big .side b{display:block;font:800 1.5rem/1 var(--display);letter-spacing:-.03em}
.big .side span{font-size:.8rem;color:var(--muted);font-weight:500}
.back{display:inline-flex;align-items:center;gap:6px;margin-top:14px;padding:8px 13px;border-radius:999px;background:var(--soft);font-size:.82rem;font-weight:600}

/* Créneaux : bascule à pastille glissante */
.slots{position:relative;display:grid;grid-template-columns:repeat(3,1fr);margin-top:20px;padding:3px;border-radius:999px;background:var(--soft)}
.slots::before{content:"";position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/3);border-radius:999px;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.08);transform:translateX(calc(var(--pos,0) * 100%));transition:transform .35s var(--spring)}
.slots.none::before{opacity:0}
.slot{position:relative;padding:9px 6px;font-size:.88rem;font-weight:600;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px;transition:color .25s}
.slot small{font-size:.7rem;font-weight:600;opacity:.7}
.slot.on{color:var(--ink)}
.slot[disabled]{opacity:.4;cursor:default}

/* Filtres */
.chips{position:sticky;top:calc(env(safe-area-inset-top,0px) + 60px);z-index:10;margin:14px -20px 0;padding:8px 20px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;background:color-mix(in srgb,var(--bg) 85%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:7px;padding:8px 13px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:.84rem;font-weight:600;white-space:nowrap;transition:background .2s,color .2s,border-color .2s,transform .15s var(--spring)}
.chip:active{transform:scale(.94)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--sc,var(--ink))}
.chip em{font-style:normal;color:var(--muted);font-weight:500}
.chip.on{background:var(--sc,var(--ink));border-color:transparent;color:#fff}
.chip.on em{color:inherit;opacity:.75}
.chip.on i{background:currentColor}
.chip.all.on{color:var(--bg)}

/* À la une */
.une{position:relative;margin-top:14px;padding:22px 20px 20px;border-radius:26px;background:color-mix(in srgb,var(--sc) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--sc) 22%,var(--line));overflow:hidden}
.une::before{content:"";position:absolute;left:0;top:0;right:0;height:4px;background:var(--sc)}
.une .tag{display:flex;align-items:center;gap:8px;font:600 .72rem/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--sc)}
.une h2{font:800 clamp(1.7rem,7.6vw,2.3rem)/1.06 var(--display);letter-spacing:-.035em;margin:12px 0 10px;text-wrap:balance;overflow-wrap:anywhere}
.une .sum{margin:0;font-size:1.02rem;line-height:1.55;color:var(--ink-2);text-wrap:pretty}

/* Fil */
.feed{list-style:none;margin:8px 0 0;padding:0}
.item{position:relative;padding:20px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.item .tag{display:flex;align-items:center;gap:7px;font:600 .7rem/1 var(--sans);letter-spacing:.13em;text-transform:uppercase;color:var(--sc)}
.item .tag i{width:7px;height:7px;border-radius:50%;background:var(--sc)}
.item .num{font:800 .95rem/1 var(--display);color:var(--muted);font-variant-numeric:tabular-nums;opacity:.6}
.item h3{font:700 1.3rem/1.15 var(--display);letter-spacing:-.025em;margin:9px 0 6px;text-wrap:balance;overflow-wrap:anywhere;transition:color .3s}
.item .sum{margin:0;font-size:.97rem;line-height:1.55;color:var(--ink-2);text-wrap:pretty;overflow-wrap:anywhere}
.item.read h3{color:var(--muted)}

/* Détails dépliables */
.more{display:inline-flex;align-items:center;gap:6px;margin-top:12px;padding:7px 12px;border-radius:999px;background:var(--soft);font-size:.8rem;font-weight:600;color:var(--ink-2);transition:background .2s,color .2s}
.more svg{width:12px;height:12px;transition:transform .35s var(--spring)}
.open .more{background:color-mix(in srgb,var(--sc,var(--c)) 14%,transparent);color:var(--sc,var(--c))}
.open .more svg{transform:rotate(180deg)}
.det{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s var(--ease)}
.open .det{grid-template-rows:1fr}
.det>div{overflow:hidden;min-height:0}
.det p{margin:14px 0 0;font-size:.97rem;line-height:1.65;color:var(--ink-2);text-wrap:pretty;overflow-wrap:anywhere}
.src{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-size:.8rem;font-weight:600;color:var(--sc,var(--c));text-decoration:none;max-width:100%}
.src svg{width:11px;height:11px;flex:none}
.quiet{margin:26px 0;padding:26px 20px;border-radius:22px;border:1px dashed var(--line);text-align:center;color:var(--muted);font-weight:500}

/* Bloc générique (culture, langues, archives) */
.blk{margin-top:34px}
.blk-h{display:flex;align-items:center;gap:10px;font:600 .72rem/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 14px}
.blk-h::after{content:"";flex:1;height:1px;background:var(--line)}
.cul{--sc:var(--c-cul);padding:20px;border-radius:26px;background:var(--surface);border:1px solid var(--line)}
.cul .tag{font:600 .72rem/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--c-cul)}
.cul h3{font:800 1.5rem/1.1 var(--display);letter-spacing:-.03em;margin:10px 0 8px;text-wrap:balance}
.cul .sum{margin:0;font-size:.98rem;line-height:1.6;color:var(--ink-2)}

.langs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lang{position:relative;display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:22px;background:var(--surface);border:1px solid var(--line);text-decoration:none;transition:transform .15s var(--spring),border-color .2s}
.lang:active{transform:scale(.97)}
.lang .lt{display:flex;align-items:center;justify-content:space-between;font-size:.74rem;font-weight:600;color:var(--muted)}
.lang .lt i{width:9px;height:9px;border-radius:50%;background:var(--lc)}
.lang[data-c=uk] .lt i{background:linear-gradient(180deg,var(--c-uk) 50%,var(--c-uk2) 50%)}
.lang b{font:800 1.25rem/1 var(--display);letter-spacing:-.03em}
.lang .ls{font-size:.78rem;color:var(--muted);font-weight:500}
.lang .bar{height:4px;border-radius:99px;background:var(--soft);overflow:hidden}
.lang .bar b{display:block;height:100%;width:0;background:var(--lc);border-radius:99px;transition:width 1s var(--ease) .3s}
.lang.now{border-color:var(--lc);box-shadow:0 0 0 3px color-mix(in srgb,var(--lc) 16%,transparent)}
.lang.now .ls{color:var(--lc);font-weight:600}

.rail{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -20px;padding:2px 20px 12px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.past{flex:none;width:min(66vw,230px);scroll-snap-align:start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px 15px;display:flex;flex-direction:column;gap:8px;transition:transform .15s var(--spring)}
.past:active{transform:scale(.96)}
.past .when{font-size:.74rem;font-weight:600;color:var(--muted)}
.past b{font:800 1.7rem/1 var(--display);letter-spacing:-.05em}
.past .ex{font-size:.86rem;font-weight:600;line-height:1.35;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.dots{display:flex;gap:5px;margin-top:auto}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--sc)}

.foot{margin-top:36px;padding-top:16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.foot b{color:var(--ink);font-weight:700}
.state{padding:70px 0 20px}
.state h1{font:800 2.4rem/1 var(--display);letter-spacing:-.04em;margin:0 0 12px}
.state p{font-size:1.02rem;color:var(--muted);margin:0}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="wm"><span class="live off" id="live"></span>Points actu</div>
    <div class="top-r">
      <span class="checked" id="updated"></span>
      <button class="ib" id="refresh" type="button" aria-label="Actualiser">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
      </button>
    </div>
  </div>
  <div class="read-bar"><b id="progress"></b></div>
</header>
<div class="wrap">
  <div class="toast" id="banner" hidden></div>
  <main id="main"><div class="state"><h1>Chargement…</h1><p>Les points de 6h, 12h et 18h s'affichent ici.</p></div></main>
  <section class="blk" id="learn"></section>
  <section class="blk" id="archive" hidden></section>
  <footer class="foot"><span id="next"></span><span>Points à 6h · 12h · 18h</span></footer>
</div>
<script>
(function(){
  var DATA="data/points.json";
  var SECTIONS=[{k:"defense",t:"Défense",c:"--c-def"},{k:"france",t:"France",c:"--c-fra"},{k:"grandest",t:"Grand Est",c:"--c-ge"},{k:"occitanie",t:"Occitanie",c:"--c-occ"},{k:"jeuvideo",t:"Jeu vidéo",c:"--c-jv"}];
  var JOURS=["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
  var MOIS=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
  var ARROW='<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M3.5 8.5l5-5M4.5 3.5h4v4"/></svg>';
  var CHEV='<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4.5l3 3 3-3"/></svg>';
  var points=[], selected=null, newId=null, lastFetch=0, loading=false, current=null, filter="all";
  var readSet={};try{readSet=JSON.parse(localStorage.getItem("read")||"{}")}catch(e){}

  function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=nb(x);return e}
  function nb(x){return String(x).replace(/ ([:;!?»])/g," $1").replace(/« /g,"« ")}
  function pad(n){return String(n).padStart(2,"0")}
  function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
  function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  function stagger(s){[].forEach.call(s.children,function(c,i){c.style.setProperty("--i",Math.min(i,8))})}
  function paris(d){
    var f=new Intl.DateTimeFormat("fr-FR",{timeZone:"Europe/Paris",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false});
    var o={};f.formatToParts(d).forEach(function(p){o[p.type]=p.value});
    return {h:+o.hour%24,mi:+o.minute,date:o.year+"-"+o.month+"-"+o.day};
  }
  function span(h){return h===6?"18h la veille → 6h":h===12?"6h → 12h":"12h → 18h"}
  function dayLabel(s){var a=s.split("-").map(Number);var dt=new Date(Date.UTC(a[0],a[1]-1,a[2],12));return JOURS[dt.getUTCDay()]+" "+a[2]+" "+MOIS[a[1]-1]}
  function relDay(s){
    var today=paris(new Date()).date;if(s===today)return "Aujourd'hui";
    var y=new Date(Date.now()-864e5);if(s===paris(y).date)return "Hier";
    var l=dayLabel(s);return l.charAt(0).toUpperCase()+l.slice(1);
  }
  function itemsOf(d,k){return ((d.sections&&d.sections[k])||[]).slice(0,4)}
  function count(d){return SECTIONS.reduce(function(n,s){return n+itemsOf(d,s.k).length},0)}
  function find(id){for(var i=0;i<points.length;i++)if(points[i].id===id)return points[i];return null}
  function sc(node,c){node.style.setProperty("--sc","var("+c+")");return node}

  // Titre / explication / détails ; les anciens points (champ "t" seul) sont découpés automatiquement.
  function sentences(s){return (s.match(/[^.!?…]+(?:[.!?…]+["»”]?|$)\s*/g)||[s]).map(function(x){return x.trim()}).filter(Boolean)}
  function parts(it){
    var titre=it.titre||"",resume=it.resume||"",details=it.details||"",t=(it.t||"").trim();
    if(!titre&&t){
      var c=t.indexOf(" : ");
      if(c>0&&c<=80){titre=t.slice(0,c);t=t.slice(c+3)}
      else{var ss=sentences(t);if(ss.length>1&&ss[0].length<=110){titre=ss.shift().replace(/[.]$/,"");t=ss.join(" ")}else{titre=t;t=""}}
      var r=sentences(t);if(!resume)resume=r.shift()||"";if(!details)details=r.join(" ");
      if(resume)resume=resume.charAt(0).toUpperCase()+resume.slice(1);
    }else if(!resume&&t)resume=t;
    return {titre:titre,resume:resume,details:details};
  }
  function readMin(d){
    var txt="";SECTIONS.forEach(function(s){itemsOf(d,s.k).forEach(function(i){var p=parts(i);txt+=" "+p.titre+" "+p.resume+" "+p.details})});
    txt+=" "+((d.culture&&d.culture.texte)||"");
    return Math.max(1,Math.round(txt.split(/\s+/).length/220));
  }
  function setProgress(d){
    var ids=[];SECTIONS.forEach(function(s){itemsOf(d,s.k).forEach(function(_,i){ids.push(d.id+"/"+s.k+"/"+i)})});
    if(d.culture&&d.culture.texte)ids.push(d.id+"/culture");
    var n=ids.filter(function(x){return readSet[x]}).length;
    document.getElementById("progress").style.width=ids.length?(n/ids.length*100)+"%":"0";
  }
  function markRead(d,key){
    if(readSet[key])return;readSet[key]=1;
    var keep={};Object.keys(readSet).forEach(function(k){if(find(k.split("/")[0]))keep[k]=1});readSet=keep;
    lsSet("read",JSON.stringify(readSet));setProgress(d);
  }

  function srcLink(it,box){
    if(!it.src)return;
    var ok=it.url&&/^https:\/\//.test(it.url);var a=el(ok?"a":"span","src","Lire sur "+it.src+" ");
    if(ok){a.href=it.url;a.target="_blank";a.rel="noopener";a.insertAdjacentHTML("beforeend",ARROW)}
    box.appendChild(a);
  }
  // Bouton « En savoir plus » + zone dépliable animée.
  function expander(host,d,key,fill,label){
    var btn=el("button","more");btn.type="button";btn.setAttribute("aria-expanded","false");
    var lab=el("span",null,label||"En savoir plus");btn.appendChild(lab);btn.insertAdjacentHTML("beforeend",CHEV);
    var det=el("div","det"),inner=el("div");fill(inner);det.appendChild(inner);
    btn.addEventListener("click",function(){
      var o=host.classList.toggle("open");btn.setAttribute("aria-expanded",o);lab.textContent=o?"Réduire":(label||"En savoir plus");
      if(o){markRead(d,key);host.classList.add("read")}
    });
    host.appendChild(btn);host.appendChild(det);
  }
  function item(d,s,it,i,n){
    var p=parts(it),key=d.id+"/"+s.k+"/"+i;
    var li=sc(el("li","item"+(readSet[key]?" read":"")),s.c);
    var head=el("div","head"),tag=el("span","tag");tag.appendChild(el("i"));tag.appendChild(document.createTextNode(s.t));
    head.appendChild(tag);head.appendChild(el("span","num",pad(n)));li.appendChild(head);
    li.appendChild(el("h3",null,p.titre));
    if(p.resume)li.appendChild(el("p","sum",p.resume));
    if(p.details||it.src)expander(li,d,key,function(b){if(p.details)b.appendChild(el("p",null,p.details));srcLink(it,b)},p.details?null:"Source");
    return li;
  }

  function renderNext(){
    var p=paris(new Date()),m=p.h*60+p.mi,slots=[362,722,1082];
    var n=slots.find(function(s){return s>m});var diff=n!=null?n-m:1440-m+362;var lab=n!=null?Math.floor(n/60)+"h":"6h";
    var e=document.getElementById("next");e.textContent="";
    e.appendChild(document.createTextNode("Prochain point à "));e.appendChild(el("b",null,lab));
    e.appendChild(document.createTextNode(" · dans "+(diff>=60?Math.floor(diff/60)+" h ":"")+pad(diff%60)+" min"));
  }
  function renderUpdated(ok){
    document.getElementById("live").classList.toggle("off",!ok);
    if(!lastFetch)return;var p=paris(new Date(lastFetch));
    document.getElementById("updated").textContent="à jour "+pad(p.h)+":"+pad(p.mi);
  }

  function renderMain(d){
    var main=document.getElementById("main");main.textContent="";
    var scr=el("div","screen");main.appendChild(scr);
    var latest=points[0];
    var mast=el("header","mast");
    var k=el("p","k",relDay(d.date)+" · "+span(d.hour));
    if(d.id===newId)k.appendChild(el("span","new","Nouveau"));
    mast.appendChild(k);
    var big=el("div","big"),h=el("h1");h.appendChild(document.createTextNode(String(d.hour)));h.appendChild(el("span",null,"h"));
    big.appendChild(h);
    var n=count(d),side=el("div","side");side.appendChild(el("b",null,n?n+(n>1?" infos":" info"):"Calme plat"));
    side.appendChild(el("span",null,readMin(d)+" min de lecture"));big.appendChild(side);mast.appendChild(big);
    if(d.id!==latest.id){
      var b=el("button","back","← Dernier point");b.type="button";
      b.addEventListener("click",function(){select(latest.id)});mast.appendChild(b);
    }
    var slots=el("div","slots"),pos=-1;
    [6,12,18].forEach(function(hh,ix){
      var p=null;points.forEach(function(x){if(x.date===d.date&&x.hour===hh&&!p)p=x});
      var s=el("button","slot");s.type="button";s.appendChild(document.createTextNode(hh+"h"));
      if(p)s.appendChild(el("small",null,count(p)));
      if(!p)s.disabled=true;else{if(p.id===d.id){s.classList.add("on");pos=ix}s.addEventListener("click",function(){select(p.id)})}
      slots.appendChild(s);
    });
    if(pos<0)slots.classList.add("none");slots.style.setProperty("--pos",Math.max(pos,0));
    mast.appendChild(slots);scr.appendChild(mast);

    var present=SECTIONS.filter(function(s){return itemsOf(d,s.k).length});
    if(filter!=="all"&&!present.some(function(s){return s.k===filter}))filter="all";
    if(present.length>1){
      var nav=el("nav","chips");nav.setAttribute("aria-label","Rubriques");
      var mk=function(key,label,c,cnt){
        var ch=el("button","chip"+(key==="all"?" all":"")+(filter===key?" on":""));ch.type="button";
        if(c)sc(ch,c);
        if(key!=="all")ch.appendChild(el("i"));ch.appendChild(document.createTextNode(label+" "));ch.appendChild(el("em",null,cnt));
        ch.addEventListener("click",function(){filter=key;renderMain(d)});nav.appendChild(ch);
      };
      mk("all","Tout",null,n);present.forEach(function(s){mk(s.k,s.t,s.c,itemsOf(d,s.k).length)});
      scr.appendChild(nav);
    }

    var list=[];present.forEach(function(s){if(filter==="all"||filter===s.k)itemsOf(d,s.k).forEach(function(it,i){list.push({s:s,it:it,i:i})})});
    if(!list.length)scr.appendChild(el("p","quiet","Rien de notable sur cette plage horaire."));
    var start=0;
    if(filter==="all"&&list.length){
      // À la une : élément marqué "une", sinon le premier.
      var u=0;list.forEach(function(x,j){if(x.it.une&&!u)u=j});var top=list.splice(u,1)[0];
      var p=parts(top.it),key=d.id+"/"+top.s.k+"/"+top.i;
      var une=sc(el("article","une"),top.s.c);
      une.appendChild(el("span","tag","À la une · "+top.s.t));
      une.appendChild(el("h2",null,p.titre));
      if(p.resume)une.appendChild(el("p","sum",p.resume));
      if(p.details||top.it.src)expander(une,d,key,function(b){if(p.details)b.appendChild(el("p",null,p.details));srcLink(top.it,b)},p.details?null:"Source");
      scr.appendChild(une);start=1;
    }
    if(list.length){
      var ul=el("ul","feed");
      list.forEach(function(x,j){ul.appendChild(item(d,x.s,x.it,x.i,j+1+start))});
      scr.appendChild(ul);
    }
    if(d.culture&&d.culture.texte&&filter==="all"){
      var wrap=el("section","blk");wrap.appendChild(el("h3","blk-h","Minute culture"));
      var c=el("div","cul"),ck=d.id+"/culture";
      c.appendChild(el("span","tag","✦ Le saviez-vous"));
      if(d.culture.sujet)c.appendChild(el("h3",null,d.culture.sujet));
      var ss=sentences(d.culture.texte);
      c.appendChild(el("p","sum",ss.shift()));
      if(ss.length)expander(c,d,ck,function(b){b.appendChild(el("p",null,ss.join(" ")))},"Lire la suite");
      else markRead(d,ck);
      wrap.appendChild(c);scr.appendChild(wrap);
    }
    stagger(scr);setProgress(d);
  }

  // Raccourcis vers les langues, avec série et progression lues dans la sauvegarde locale de learn.html.
  function renderLearn(){
    var box=document.getElementById("learn");box.textContent="";
    box.appendChild(el("h3","blk-h","15 min de langue"));
    var P=null;try{P=JSON.parse(lsGet("learn")||"null")}catch(e){}
    var now=paris(new Date()),today=now.date,g=el("div","langs");
    [["en","English","Le matin","--c-en"],["uk","Українська","Le soir","--c-uk"]].forEach(function(x){
      var c=P&&P.courses&&P.courses[x[0]],days=(c&&c.days)||{},st=0,t=today;
      var act=function(s){var y=days[s];return y&&(y.rev>0||y.lec||y.lire)};
      var prev=function(s){var a=s.split("-").map(Number);return new Date(Date.UTC(a[0],a[1]-1,a[2]-1,12)).toISOString().slice(0,10)};
      if(!act(t))t=prev(t);
      while(act(t)){st++;t=prev(t)}
      var doneToday=!!(days[today]&&days[today].lec),n=c?Math.max(0,(c.next||1)-1):0;
      var a=el("a","lang"+((x[0]==="en")===(now.h<14)&&!doneToday?" now":""));a.href="learn.html?c="+x[0];a.dataset.c=x[0];a.style.setProperty("--lc","var("+x[3]+")");
      var lt=el("div","lt");lt.appendChild(document.createTextNode(x[2]));lt.appendChild(el("i"));a.appendChild(lt);
      a.appendChild(el("b",null,x[1]));
      a.appendChild(el("span","ls",doneToday?"✓ Fait aujourd'hui":st?"🔥 "+st+" j · leçon "+(n+1):"Leçon "+(n+1)+" · 15 min"));
      var bar=el("div","bar"),bb=el("b");bar.appendChild(bb);a.appendChild(bar);
      requestAnimationFrame(function(){requestAnimationFrame(function(){bb.style.width=(n/90*100)+"%"})});
      g.appendChild(a);
    });
    box.appendChild(g);
  }

  function renderArchive(d){
    var arch=document.getElementById("archive");arch.textContent="";
    var rest=points.filter(function(p){return p.id!==d.id});
    arch.hidden=!rest.length;if(!rest.length)return;
    arch.appendChild(el("h3","blk-h","Points précédents"));
    var rail=el("div","rail");
    rest.forEach(function(p){
      var r=el("button","past");r.type="button";
      r.appendChild(el("span","when",relDay(p.date)));
      r.appendChild(el("b",null,p.hour+"h"));
      var first=null;SECTIONS.forEach(function(s){var it=itemsOf(p,s.k);if(it.length&&!first)first=parts(it[0]).titre});
      r.appendChild(el("span","ex",first||(p.culture&&p.culture.sujet?"✦ "+p.culture.sujet:"Rien de notable.")));
      var dots=el("span","dots");
      SECTIONS.forEach(function(s){if(itemsOf(p,s.k).length){var i=sc(el("i"),s.c);i.title=s.t;dots.appendChild(i)}});
      if(p.culture&&p.culture.texte)dots.appendChild(sc(el("i"),"--c-cul"));
      r.appendChild(dots);
      r.addEventListener("click",function(){select(p.id)});
      rail.appendChild(r);
    });
    arch.appendChild(rail);
  }

  function select(id){
    var d=find(id)||points[0];selected=d.id;filter="all";renderMain(d);renderArchive(d);
    window.scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
  }

  function render(){
    var main=document.getElementById("main");
    if(!points.length){
      main.textContent="";var st=el("div","state");st.appendChild(el("h1",null,"Aucun point pour l'instant"));
      st.appendChild(el("p",null,"Le prochain point (6h, 12h ou 18h) apparaîtra ici."));main.appendChild(st);
      document.getElementById("archive").hidden=true;return;
    }
    var top=points[0],seen=lsGet("lastSeen");
    if(seen&&seen!==top.id)newId=top.id;
    lsSet("lastSeen",top.id);
    var d=(selected&&find(selected))||top;selected=d.id;renderMain(d);renderArchive(d);
  }

  function setData(j){
    points=(j.points||[]).slice().sort(function(a,b){return a.publishedAt<b.publishedAt?1:-1});
    var sig=JSON.stringify(points.map(function(p){return p.id}));
    if(sig!==current){
      if(current&&points[0]&&!find(selected))selected=null;
      if(current&&points[0]&&current.indexOf(points[0].id)<0)selected=points[0].id;
      current=sig;render();
    }
  }

  async function load(){
    if(loading)return;loading=true;
    var btn=document.getElementById("refresh"),banner=document.getElementById("banner"),ok=false;btn.classList.add("spin");
    try{
      var r=await fetch(DATA+"?t="+Date.now(),{cache:"no-store"});
      if(!r.ok)throw new Error(r.status);
      var j=await r.json();setData(j);
      lastFetch=Date.now();banner.hidden=true;ok=true;
      lsSet("cache",JSON.stringify(j));
    }catch(e){
      var c=lsGet("cache");
      if(c&&!current){try{setData(JSON.parse(c))}catch(_){}}
      banner.textContent="Hors ligne : derniers points enregistrés affichés.";banner.hidden=false;
    }finally{loading=false;btn.classList.remove("spin");renderUpdated(ok);renderNext()}
  }

  document.getElementById("refresh").addEventListener("click",load);
  document.addEventListener("visibilitychange",function(){if(!document.hidden){renderLearn();if(Date.now()-lastFetch>60e3)load()}});
  setInterval(function(){renderNext();if(!document.hidden&&Date.now()-lastFetch>5*60e3)load()},30e3);
  renderLearn();
  load();
  if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
})();
</script>
</body>
